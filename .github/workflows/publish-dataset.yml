name: Publish Hugging Face dataset
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Scrape DMC']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: huggingface-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Publish validated historical data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: |
          if [[ -z "$HF_TOKEN" || -z "$HF_DATASET_REPO" ]]; then
            echo 'Set HF_TOKEN secret and HF_DATASET_REPO repository variable.'
            exit 1
          fi
          for attempt in 1 2 3; do
            if python -m huggingface.upload_dataset; then exit 0; fi
            sleep $((attempt * 10))
          done
          exit 1
