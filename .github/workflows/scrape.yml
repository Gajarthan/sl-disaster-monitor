name: Scrape DMC
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      recheck:
        description: Re-download known URLs to detect replaced PDFs
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: dmc-data-writer
  cancel-in-progress: false
jobs:
  scrape:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Collect official reports
        id: collection
        continue-on-error: true
        env:
          RECHECK: ${{ inputs.recheck }}
        run: |
          args=()
          if [[ "$RECHECK" == "true" || "$(date -u +%H)" == "00" ]]; then args+=(--recheck); fi
          python -m scraper.pipeline "${args[@]}"
      - name: Validate structured archive
        run: python -m huggingface.build_dataset --validate
      - name: Commit data and health if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data archive state
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh DMC reports and pipeline health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve failed run status
        if: steps.collection.outcome == 'failure'
        run: |
          echo 'Collection was incomplete; prior records and explicit failure health were preserved.'
          exit 1
